<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ekstrakurikuler SMK N Tengaran</title>

  <style>
    /* ===== VARIABEL WARNA (terang & gelap) ===== */
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg:#e9f0ff;
      --card:#ffffffe6;
      --tx:#101a3a;
      --mut:#5a6a94;
      --bd:#c3d0f2;
      --ok:#16a34a;
      --er:#e11d48;
      --c:#3b82f6;
      --ac:var(--c);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --bg:#0a0f24;
        --card:#141b3ae6;
        --tx:#eaf0ff;
        --mut:#8fa0cc;
        --bd:#2a3566;
        --ok:#4ade80;
        --er:#fb7185;
      }
    }
    :root[data-theme=dark] {
      --bg:#0a0f24;
      --card:#141b3ae6;
      --tx:#eaf0ff;
      --mut:#8fa0cc;
      --bd:#2a3566;
      --ok:#4ade80;
      --er:#fb7185;
    }
    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }
    * {
      box-sizing: border-box;
    }
    /* ===== LAYOUT UTAMA ===== */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family:
        "Trebuchet MS",
        system-ui,
        sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* ===== IKON EKSKUL BERJATUHAN (latar belakang) ===== */
    #fall {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    #fall span {
      position: absolute;
      top: -80px;
      opacity: .3;
      animation: drop linear infinite;
    }
    #fall svg {
      width: 100%;
      height: 100%;
    }
    @keyframes drop {
      to {
        transform: translateY(115vh) rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #fall span {
        animation: none;
      }
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 26px 16px 110px;
    }
    header {
      text-align: center;
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font: 900 clamp(1.6rem, 6.5vw, 2.8rem)/1.1 "Trebuchet MS", sans-serif;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 var(--c);
      transition: text-shadow .4s;
    }
    header p {
      color: var(--mut);
      margin: .6rem 0 0;
    }
    .grid {
      display: grid;
      gap: 26px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 900px) {
      .grid {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }
    /* ===== KARTU ANGGOTA 3D ===== */
    .stage {
      perspective: 1000px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    #card {
      width: min(340px, 100%);
      aspect-ratio: 1.586;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--fl,0deg)));
      transition: transform .15s ease-out;
      animation: fl 4s ease-in-out infinite;
    }
    @keyframes fl {
      50% {
        translate: 0 -10px;
      }
    }
    #card.flip {
      --fl:180deg;
      transition: transform .9s cubic-bezier(.3, 1.4, .5, 1);
    }
    .face {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 16px;
      color: #fff;
      backface-visibility: hidden;
      overflow: hidden;
      background:
        linear-gradient(
          135deg,
          var(--c),
          color-mix(in srgb, var(--c) 35%, #000));
      box-shadow: 0 24px 50px #0006, inset 0 0 0 2px #fff3;
      transition: background .4s;
    }
    .face:after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at var(--mx,50%) var(--my,0%),
          #fff7,
          transparent 55%);
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    .back {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      font-size: .62rem;
      letter-spacing: .2em;
      font-weight: 700;
      opacity: .85;
    }
    .av {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #fff3;
      border: 3px solid #fff;
      display: grid;
      place-items: center;
      margin: 14px 0 8px;
      animation: pulse 2s infinite;
    }
    .av svg {
      width: 30px;
      height: 30px;
    }
    @keyframes pulse {
      50% {
        box-shadow: 0 0 0 10px #fff2;
      }
    }
    #cn {
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .05em;
    }
    .sm {
      font-size: .74rem;
      opacity: .9;
      margin-top: 2px;
      word-break: break-all;
    }
    #cid {
      position: absolute;
      right: 16px;
      bottom: 14px;
      font: 700 .7rem monospace;
      letter-spacing: .15em;
      opacity: .8;
    }
    #qr {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 2px;
      width: 96px;
      background: #fff;
      padding: 6px;
      border-radius: 8px;
    }
    #qr b {
      aspect-ratio: 1;
      background: #fff;
    }
    #qr b.on {
      background: #111;
    }
    .stamp {
      font: 900 1.4rem Georgia, serif;
      border: 3px solid #fff;
      padding: 2px 12px;
      border-radius: 8px;
      transform: rotate(-8deg);
      letter-spacing: .1em;
    }
    /* ===== XP, LEVEL & LENCANA ===== */
    .xp {
      width: min(340px, 100%);
    }
    .xpt {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: .8rem;
      letter-spacing: .1em;
    }
    .xpb {
      height: 14px;
      border-radius: 9px;
      background: var(--bd);
      overflow: hidden;
      margin: 6px 0 10px;
      border: 2px solid var(--tx);
    }
    #xpi {
      display: block;
      height: 100%;
      width: 0;
      background:
        repeating-linear-gradient(
          45deg,
          var(--c) 0 10px,
          color-mix(in srgb, var(--c) 70%, #fff) 10px 20px);
      transition: width .5s cubic-bezier(.3, 1.4, .5, 1);
    }
    #badges {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .bd {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 2px solid var(--bd);
      color: var(--mut);
      transition: all .3s;
    }
    .bd svg {
      width: 20px;
      height: 20px;
    }
    .bd.on {
      background: var(--c);
      border-color: var(--tx);
      color: #fff;
      animation: pop .5s;
    }
    @keyframes pop {
      40% {
        transform: scale(1.35) rotate(-8deg);
      }
    }
    /* ===== FORM & VALIDASI ===== */
    .panel {
      background: var(--card);
      border: 2px solid var(--tx);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 6px 6px 0 var(--c);
      backdrop-filter: blur(8px);
      transition: box-shadow .4s;
    }
    .f {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .w {
      position: relative;
    }
    input,
    select {
      width: 100%;
      padding: 12px 40px 12px 42px;
      border-radius: 12px;
      border: 2px solid var(--bd);
      background: transparent;
      color: var(--tx);
      font: inherit;
      outline: none;
      transition: .2s;
    }
    select {
      padding-right: 12px;
    }
    select option {
      color: #111;
    }
    input:focus,
    select:focus {
      border-color: var(--c);
      box-shadow: 3px 3px 0 var(--c);
    }
    .ic {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      color: var(--c);
      pointer-events: none;
    }
    .ic svg {
      width: 18px;
      height: 18px;
    }
    .st {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: 900;
    }
    .eye {
      position: absolute;
      right: 36px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      cursor: pointer;
      font: 700 .72rem inherit;
      color: var(--c);
    }
    #pass,
    #pass2 {
      padding-right: 100px;
    }
    .f.err input,
    .f.err select {
      border-color: var(--er);
    }
    .f.ok input,
    .f.ok select {
      border-color: var(--ok);
    }
    .f.err .st,
    .f.err .msg {
      color: var(--er);
    }
    .f.ok .st,
    .f.ok .msg {
      color: var(--ok);
    }
    .f.err {
      animation: sh .35s;
    }
    @keyframes sh {
      25% {
        transform: translateX(-6px);
      }
      75% {
        transform: translateX(6px);
      }
    }
    .msg {
      font-size: .76rem;
      min-height: 1em;
      margin-top: 4px;
      color: var(--mut);
    }
    .bar {
      height: 5px;
      border-radius: 5px;
      background: var(--bd);
      margin-top: 6px;
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 0;
      transition: .3s;
    }
    /* ===== TOMBOL & PESAN BERHASIL ===== */
    .go {
      width: 100%;
      padding: 14px;
      border: 2px solid var(--tx);
      border-radius: 14px;
      font: 900 1rem inherit;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #fff;
      background: var(--c);
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--tx);
      transition: .12s;
    }
    .go:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--tx);
    }
    .go:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--tx);
    }
    #res {
      display: none;
      text-align: center;
    }
    #res.show {
      display: block;
      animation: pop .6s;
    }
    #res svg {
      width: 56px;
      height: 56px;
      color: var(--ok);
    }
    .cf {
      position: fixed;
      top: -30px;
      z-index: 99;
      pointer-events: none;
      animation: fall 2.6s linear forwards;
    }
    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: .2;
      }
    }
    /* ===== CHATBOT ===== */
    #cb {
      position: fixed;
      right: max(16px, env(safe-area-inset-right, 0px));
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 50;
    }
    #fab {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid var(--tx);
      background: var(--c);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--tx);
      animation: fl 2.4s infinite;
    }
    #fab svg {
      width: 26px;
      height: 26px;
    }
    #win {
      display: none;
      position: absolute;
      right: 0;
      bottom: 70px;
      width: min(330px, calc(100vw - 32px));
      height: 400px;
      background: var(--bg);
      border: 2px solid var(--tx);
      border-radius: 16px;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 5px 5px 0 var(--c);
    }
    #win.open {
      display: flex;
      animation: pop .4s;
    }
    .hd {
      padding: 12px 14px;
      font-weight: 800;
      background: var(--c);
      color: #fff;
      border-bottom: 2px solid var(--tx);
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .m {
      max-width: 85%;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: .86rem;
      white-space: pre-line;
      animation: pop .3s;
    }
    .bot {
      background: var(--card);
      border: 1.5px solid var(--bd);
      align-self: flex-start;
    }
    .me {
      background: var(--c);
      color: #fff;
      align-self: flex-end;
    }
    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 0 12px 8px;
    }
    .chips button {
      border: 1.5px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      border-radius: 99px;
      padding: 4px 10px;
      font-size: .75rem;
      cursor: pointer;
    }
    #cf {
      display: flex;
      border-top: 2px solid var(--tx);
    }
    #cf input {
      border: 0;
      border-radius: 0;
      padding: 12px;
      box-shadow: none;
    }
    #cf button {
      border: 0;
      background: var(--c);
      color: #fff;
      padding: 0 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="fall"></div>
  <main>
    <header>
      <h1>Ekstrakurikuler<br>SMK N Tengaran</h1>
      <p>Bikin kartu anggotamu, naik level, lalu gabung!</p>
    </header>
    <div class="grid">
      <section class="stage">
        <div id="card">
          <div class="face front">
            <div class="top">
              <span>KARTU ANGGOTA</span>
              <span>EKSKUL</span>
            </div>
            <div class="av" id="av">
              <i data-lucide="user"></i>
            </div>
            <div id="cn">NAMA KAMU</div>
            <div class="sm" id="cm">email@kamu.com</div>
            <div class="sm" id="ce">Belum pilih ekskul</div>
            <div id="cid">EK-0000</div>
          </div>
          <div class="face back">
            <div class="stamp">TERDAFTAR</div>
            <div id="qr"></div>
            <div class="sm" id="cb2"></div>
          </div>
        </div>
        <div class="xp">
          <div class="xpt">
            <span id="lv">LEVEL 0/5</span>
            <span id="xpn">0 XP</span>
          </div>
          <div class="xpb">
            <i id="xpi"></i>
          </div>
          <div id="badges">
            <span class="bd">
              <i data-lucide="user"></i>
            </span>
            <span class="bd">
              <i data-lucide="mail"></i>
            </span>
            <span class="bd">
              <i data-lucide="lock"></i>
            </span>
            <span class="bd">
              <i data-lucide="key-round"></i>
            </span>
            <span class="bd">
              <i data-lucide="award"></i>
            </span>
          </div>
        </div>
      </section>
      <section class="panel">
        <form id="fm" novalidate>
          <div class="f" id="f-nama">
            <label for="nama">Nama Lengkap</label>
            <div class="w">
              <span class="ic">
                <i data-lucide="user"></i>
              </span>
              <input id="nama" type="text" placeholder="Minimal 3 karakter" autocomplete="name">
              <span class="st"></span>
            </div>
            <div class="msg"></div>
          </div>
          <div class="f" id="f-email">
            <label for="email">Email</label>
            <div class="w">
              <span class="ic">
                <i data-lucide="mail"></i>
              </span>
              <input id="email" type="email" placeholder="nama@email.com" autocomplete="email">
              <span class="st"></span>
            </div>
            <div class="msg"></div>
          </div>
          <div class="f" id="f-pass">
            <label for="pass">Password</label>
            <div class="w">
              <span class="ic">
                <i data-lucide="lock"></i>
              </span>
              <input id="pass" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password">
              <button type="button" class="eye" data-t="pass">Lihat</button>
              <span class="st"></span>
            </div>
            <div class="bar">
              <i id="bar"></i>
            </div>
            <div class="msg"></div>
          </div>
          <div class="f" id="f-pass2">
            <label for="pass2">Konfirmasi Password</label>
            <div class="w">
              <span class="ic">
                <i data-lucide="key-round"></i>
              </span>
              <input id="pass2" type="password" placeholder="Ulangi password" autocomplete="new-password">
              <button type="button" class="eye" data-t="pass2">Lihat</button>
              <span class="st"></span>
            </div>
            <div class="msg"></div>
          </div>
          <div class="f" id="f-ek">
            <label for="ek">Pilih Ekstrakurikuler</label>
            <div class="w">
              <span class="ic">
                <i data-lucide="award"></i>
              </span>
              <select id="ek">
                <option value="">-- Pilih ekskul --</option>
              </select>
            </div>
            <div class="msg"></div>
          </div>
          <button class="go" type="submit">Klaim Kartu</button>
        </form>
        <div id="res">
          <i data-lucide="party-popper"></i>
          <h2>Pendaftaran Berhasil!</h2>
          <p id="rt"></p>
          <button class="go" id="again" type="button">Daftar lagi</button>
        </div>
      </section>
    </div>
  </main>
  <div id="cb">
    <div id="win">
      <div class="hd">Sensei Bot</div>
      <div id="log"></div>
      <div class="chips" id="chips"></div>
      <div id="cf">
        <input id="ci" placeholder="Tanya sesuatu..." autocomplete="off">
        <button id="cs" aria-label="Kirim">&#10148;</button>
      </div>
    </div>
    <button id="fab" aria-label="Chatbot">
      <i data-lucide="message-circle"></i>
    </button>
  </div>

  <!-- Library ikon Lucide (butuh internet) -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>

  <script>
    // ===== HELPER =====
    var $ = function(i2) {
      return document.getElementById(i2);
    }, root = document.documentElement.style;
    // ===== DATA EKSKUL: [nama, deskripsi, ikon, warna] =====
    var E = [
      ["Jurnalistik", "Menulis berita, fotografi, dan mengelola media sekolah.", "newspaper", "#2563eb"],
      ["PMR", "Pertolongan pertama, kesehatan, dan kepedulian sosial.", "heart-pulse", "#dc2626"],
      ["Paskibra", "Baris-berbaris, kedisiplinan, dan pengibaran bendera.", "flag", "#b91c1c"],
      ["Pencak Silat", "Bela diri tradisional: fisik, mental, sportivitas.", "swords", "#475569"],
      ["Nari", "Tari tradisional maupun modern untuk tampil di acara sekolah.", "sparkles", "#db2777"],
      ["Bahasa Jepang", "Mengenal bahasa dan budaya Jepang dari huruf dasar.", "languages", "#e11d48"],
      ["Bantara", "Kepramukaan tingkat penegak: mandiri dan jadi pemimpin.", "tent", "#4d7c0f"],
      ["Futsal", "Olahraga tim yang melatih kerja sama dan stamina.", "goal", "#16a34a"],
      ["Voli", "Servis, umpan, dan smash bersama tim.", "volleyball", "#ea8a00"],
      ["Drumband", "Marching band: alat musik dan formasi kompak.", "drum", "#ea580c"],
      ["Rohis", "Kajian, kegiatan keagamaan, dan kebersamaan.", "moon", "#0d9488"],
      ["MTQ", "Seni baca dan pemahaman Al-Qur'an.", "book-open", "#0891b2"],
      ["Faster", "Ekskul sekolah. Tanyakan detailnya ke pembina ya.", "star", "#7c3aed"],
      ["Padus", "Paduan suara: olah vokal dan harmoni.", "mic", "#c026d3"]
    ];
    var sel = $("ek");
    E.forEach(function(x) {
      var o = document.createElement("option");
      o.value = x[0];
      o.textContent = x[0];
      sel.appendChild(o);
    });
    function ic() {
      window.lucide && lucide.createIcons();
    }
    function beep(f) {
      try {
        var a = window.AC = window.AC || new AudioContext(), o = a.createOscillator(), g2 = a.createGain();
        o.type = "square";
        o.frequency.value = f;
        g2.gain.value = 0.04;
        o.connect(g2);
        g2.connect(a.destination);
        o.start();
        g2.gain.exponentialRampToValueAtTime(1e-3, a.currentTime + 0.18);
        o.stop(a.currentTime + 0.18);
      } catch (e) {
      }
    }
    // ===== ATURAN VALIDASI (string kosong = valid) =====
    var R = {
      nama: function(v) {
        return v.trim().length >= 3 ? "" : "Nama minimal 3 karakter";
      },
      email: function(v) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? "" : "Format email belum benar (nama@email.com)";
      },
      pass: function(v) {
        return v.length >= 8 ? "" : "Password minimal 8 karakter";
      },
      pass2: function(v) {
        return v && v === $("pass").value ? "" : "Konfirmasi harus sama dengan password";
      },
      ek: function(v) {
        return v ? "" : "Pilih salah satu ekskul";
      }
    };
    var K = Object.keys(R), OKM = { nama: "Nama oke!", email: "Email valid!", pass: "Password cukup panjang!", pass2: "Password cocok!", ek: "Ekskul terpilih!" }, lvl = 0;
    // ===== VALIDASI REAL-TIME =====
    function chk(k) {
      var v = $(k).value, e = R[k](v), f = $("f-" + k), m = f.querySelector(".msg"), s = f.querySelector(".st");
      f.classList.remove("ok", "err");
      void f.offsetWidth;
      if (!v && k != "ek") {
        m.textContent = "";
        if (s) s.textContent = "";
        return false;
      }
      f.classList.add(e ? "err" : "ok");
      m.textContent = e || OKM[k];
      if (s) s.textContent = e ? "\u2715" : "\u2713";
      if (k == "pass") {
        var sc = (v.length >= 8) + /[A-Z]/.test(v) + /\d/.test(v) + /[^\w]/.test(v), b = $("bar");
        b.style.width = v ? sc * 25 + "%" : "0";
        b.style.background = ["#e11d48", "#e11d48", "#f59e0b", "#84cc16", "#16a34a"][sc];
      }
      return !e;
    }
    K.slice(0, 4).forEach(function(k) {
      $(k).addEventListener("input", function() {
        chk(k);
        if (k == "pass" && $("pass2").value) chk("pass2");
        sync();
      });
    });
    sel.onchange = function() {
      chk("ek");
      sync();
    };
    [].forEach.call(document.querySelectorAll(".eye"), function(b) {
      b.onclick = function() {
        var i2 = $(b.dataset.t);
        i2.type = i2.type == "password" ? "text" : "password";
        b.textContent = i2.type == "password" ? "Lihat" : "Sembunyi";
      };
    });
    // ===== KARTU 3D + XP (update saat form diisi) =====
    function sync() {
      var x = E.find(function(e) {
        return e[0] == sel.value;
      }), n = $("nama").value.trim();
      $("cn").textContent = n ? n.toUpperCase().slice(0, 20) : "NAMA KAMU";
      $("cm").textContent = $("email").value || "email@kamu.com";
      $("ce").textContent = x ? x[0] + " \u2022 " + x[1].slice(0, 34) + "..." : "Belum pilih ekskul";
      root.setProperty("--c", x ? x[3] : "#3b82f6");
      $("av").innerHTML = '<i data-lucide="' + (x ? x[2] : "user") + '"></i>';
      var h = 0;
      for (var i2 = 0; i2 < n.length; i2++) h = (h * 31 + n.charCodeAt(i2)) % 9973;
      $("cid").textContent = "EK-" + String(h).padStart(4, "0");
      var ok = K.map(function(k) {
        return !R[k]($(k).value);
      }), c = ok.filter(Boolean).length;
      [].forEach.call(document.querySelectorAll(".bd"), function(b, i3) {
        b.classList.toggle("on", ok[i3]);
      });
      $("lv").textContent = "LEVEL " + c + "/5";
      $("xpn").textContent = c * 20 + " XP";
      $("xpi").style.width = c * 20 + "%";
      if (c > lvl) beep(300 + c * 120);
      lvl = c;
      ic();
    }
    var tx = innerWidth / 2, ty = innerHeight / 2;
    addEventListener("pointermove", function(e) {
      tx = e.clientX;
      ty = e.clientY;
      var c = $("card");
      c.style.setProperty("--ry", (tx / innerWidth - 0.5) * 34 + "deg");
      c.style.setProperty("--rx", -(ty / innerHeight - 0.5) * 34 + "deg");
      [].forEach.call(document.querySelectorAll(".face"), function(f) {
        f.style.setProperty("--mx", tx / innerWidth * 100 + "%");
        f.style.setProperty("--my", ty / innerHeight * 100 + "%");
      });
    });
    // ===== CONFETTI & SUBMIT =====
    function conf() {
      var c = ["#3b82f6", "#f59e0b", "#ec4899", "#22c55e", "#a855f7"];
      for (var i2 = 0; i2 < 60; i2++) {
        var d = document.createElement("div");
        d.className = "cf";
        d.style.cssText = "width:9px;height:14px;border-radius:2px;background:" + c[i2 % 5] + ";left:" + Math.random() * 100 + "vw;animation-delay:" + Math.random() + "s";
        document.body.appendChild(d);
        setTimeout(function(x) {
          x.remove();
        }, 3800, d);
      }
    }
    $("fm").addEventListener("submit", function(e) {
      e.preventDefault();
      var ok = true;
      K.forEach(function(k) {
        if (!chk(k)) {
          ok = false;
          var f = $("f-" + k);
          f.classList.add("err");
          f.querySelector(".msg").textContent = R[k]($(k).value);
        }
      });
      if (!ok) {
        beep(150);
        return;
      }
      var h = 0, n = $("nama").value;
      for (var i2 = 0; i2 < n.length; i2++) h = (h * 31 + n.charCodeAt(i2)) % 9973;
      var q = "";
      for (var r = 0; r < 9; r++) for (var c = 0; c < 9; c++) {
        h = (h * 1103 + 12345) % 65536;
        var fin = r < 3 && (c < 3 || c > 5) || r > 5 && c < 3;
        q += '<b class="' + (fin || h % 2 ? "on" : "") + '"></b>';
      }
      $("qr").innerHTML = q;
      $("cb2").textContent = n.toUpperCase() + " \u2022 " + sel.value;
      $("rt").textContent = "Selamat " + n.trim() + "! Kamu terdaftar di ekskul " + sel.value + ".";
      $("fm").style.display = "none";
      $("res").classList.add("show");
      $("card").classList.add("flip");
      conf();
      [392, 523, 659, 784].forEach(function(f, i3) {
        setTimeout(beep, i3 * 120, f);
      });
      ic();
    });
    $("again").onclick = function() {
      $("fm").reset();
      $("fm").style.display = "";
      $("res").classList.remove("show");
      $("card").classList.remove("flip");
      [].forEach.call(document.querySelectorAll(".f"), function(f) {
        f.classList.remove("ok", "err");
        f.querySelector(".msg").textContent = "";
        var s = f.querySelector(".st");
        if (s) s.textContent = "";
      });
      $("bar").style.width = "0";
      lvl = 0;
      sync();
    };
    // ===== IKON EKSKUL BERJATUHAN =====
    for (var i = 0; i < 26; i++) {
      var ek = E[i % E.length], sp = document.createElement("span"), z = 28 + Math.random() * 30;
      sp.style.cssText = "left:" + Math.random() * 96 + "%;width:" + z + "px;height:" + z + "px;color:" + ek[3] + ";animation-duration:" + (9 + Math.random() * 11) + "s;animation-delay:-" + Math.random() * 20 + "s";
      sp.innerHTML = '<i data-lucide="' + ek[2] + '"></i>';
      $("fall").appendChild(sp);
    }
    // ===== CHATBOT =====
    var log = $("log");
    function say(t, c) {
      var d = document.createElement("div");
      d.className = "m " + c;
      d.textContent = t;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }
    function ans(q) {
      q = q.toLowerCase();
      var x = E.find(function(e) {
        return q.indexOf(e[0].toLowerCase()) > -1;
      });
      if (x) return x[0] + ": " + x[1] + "\nPilih di dropdown untuk melihat kartumu berubah!";
      if (/halo|hai|hi\b/.test(q)) return "Halo, calon anggota! Aku Sensei Bot. Tanya soal ekskul atau cara daftar ya.";
      if (/pass|sandi/.test(q)) return "Password minimal 8 karakter, konfirmasinya harus sama. Garis di bawah kolom menunjukkan kekuatannya.";
      if (/level|xp|badge/.test(q)) return "Tiap kolom yang benar memberi 20 XP dan membuka satu lencana. Capai LEVEL 5/5 lalu klaim kartumu!";
      if (/kartu|3d/.test(q)) return "Gerakkan kursor atau jarimu, kartunya ikut miring dan berkilau. Setelah daftar, kartunya berbalik!";
      if (/daftar|cara|submit|kirim/.test(q)) return "1) Isi nama, email, password\n2) Konfirmasi password\n3) Pilih ekskul\n4) Klik Klaim Kartu\nKolom hijau benar, merah perlu diperbaiki.";
      if (/ekskul|ekstra|pilih|apa saja/.test(q)) return "Ada 14 ekskul: " + E.map(function(e) {
        return e[0];
      }).join(", ") + ". Ketik salah satunya untuk info!";
      if (/jadwal|biaya|pembina/.test(q)) return "Jadwal, biaya, dan pembina tanyakan langsung ke sekolahmu ya.";
      return "Hmm, aku belum paham. Coba ketik nama ekskul atau tanya cara daftar.";
    }
    function send(t) {
      t = t.trim();
      if (!t) return;
      say(t, "me");
      setTimeout(function() {
        say(ans(t), "bot");
      }, 400);
    }
    ["Cara daftar?", "Apa itu XP?", "Futsal", "Kartu 3D"].forEach(function(t) {
      var b = document.createElement("button");
      b.textContent = t;
      b.onclick = function() {
        send(t);
      };
      $("chips").appendChild(b);
    });
    say("Halo, calon anggota! Aku Sensei Bot. Mau info ekskul atau cara daftar?", "bot");
    $("fab").onclick = function() {
      $("win").classList.toggle("open");
    };
    $("cs").onclick = function() {
      send($("ci").value);
      $("ci").value = "";
    };
    $("ci").addEventListener("keydown", function(e) {
      if (e.key == "Enter") {
        send($("ci").value);
        $("ci").value = "";
      }
    });
    sync();
  </script>
</body>
</html>
